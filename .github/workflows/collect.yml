name: Collect room availability

on:
  schedule:
    # 10:00-17:59 JST: every 30 minutes, shifted away from the top of the hour.
    - cron: "7,37 10-17 * * *"
      timezone: "Asia/Tokyo"
    # 18:00-01:59 JST: every 15 minutes (split because the range crosses midnight).
    - cron: "7,22,37,52 18-23 * * *"
      timezone: "Asia/Tokyo"
    - cron: "7,22,37,52 0-1 * * *"
      timezone: "Asia/Tokyo"
    # 02:00-09:59 JST: once per hour.
    - cron: "7 2-9 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: donan-room-watch-collect-main
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect availability
        run: python src/scraper.py

      - name: Check data changes
        id: data_changes
        run: |
          if git diff --quiet -- data/latest.json data/history.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit: skipped (no data changes)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed data files:"
            git diff --name-only -- data/latest.json data/history.csv
          fi

      - name: Commit and push data
        if: steps.data_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/latest.json data/history.csv
          git commit -m "chore(data): collect room availability"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "commit: pushed to main"
